type: button
widget_id: icloud_calendar-widget
api_url: /module/icloud/get_button_widget/calendar_enabled
i18n_title: icloud.calendar_widget
i18n_tooltip: "Shows iCloud Calendar sync status across all clients. Red indicates calendar sync is enabled, green indicates it is disabled."
icon: fa-calendar
listing_link: /show/listing/icloud/icloud
buttons:
  - label: yes
    i18n_label: enabled
    class: btn-danger
    search_component: calendar_yes
  - label: no
    i18n_label: disabled
    class: btn-success
    search_component: calendar_no
