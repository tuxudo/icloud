type: button
widget_id: icloud_bookmarks-widget
api_url: /module/icloud/get_button_widget/bookmarks_enabled
i18n_title: icloud.bookmarks_widget
i18n_tooltip: "Shows iCloud Bookmarks sync status across all clients. Red indicates bookmarks sync is enabled, green indicates it is disabled."
icon: fa-bookmark
listing_link: /show/listing/icloud/icloud
buttons:
  - label: yes
    i18n_label: enabled
    class: btn-danger
    search_component: bookmarks_yes
  - label: no
    i18n_label: disabled
    class: btn-success
    search_component: bookmarks_no
