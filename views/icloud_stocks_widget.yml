type: button
widget_id: icloud_stocks-widget
api_url: /module/icloud/get_button_widget/stocks_enabled
i18n_title: icloud.stocks_widget
i18n_tooltip: "Shows iCloud Stocks sync status across all clients. Red indicates Stocks sync is enabled, green indicates it is disabled."
icon: fa-line-chart
listing_link: /show/listing/icloud/icloud
buttons:
  - label: yes
    i18n_label: enabled
    class: btn-danger
    search_component: stocks_enabled_yes
  - label: no
    i18n_label: disabled
    class: btn-success
    search_component: stocks_enabled_no
