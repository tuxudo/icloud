type: button
widget_id: icloud_contacts-widget
api_url: /module/icloud/get_button_widget/contacts_enabled
i18n_title: icloud.contacts_icloud
i18n_tooltip: "Shows iCloud Contacts sync status across all clients. Red indicates contacts sync is enabled, green indicates it is disabled."
icon: fa-address-book
listing_link: /show/listing/icloud/icloud
buttons:
  - label: yes
    i18n_label: enabled
    class: btn-danger
    search_component: contacts_yes
  - label: no
    i18n_label: disabled
    class: btn-success
    search_component: contacts_no
